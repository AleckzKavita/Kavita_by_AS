<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg" href="../favicon/favicon.svg">
    <title>Kavita</title>
</head>

<body>
    <img class="hero__image" src="../images/titelbild.webp" alt="Arbeitsplatz mit Laptop, Kaffeetasse und Notizbuch">

    <header class="header">
        <img class="logo" src="/logo/logo_kavita.svg" alt="Kavita Logo">

        <span class="header__slogan fc__neutral fs__s">
            Mediengestalter<br>
            <span class="overlay__headline fc__accent fs__m">Digital & Print</span>
        </span>

        <nav id="navbar" class="navbar" popover>
            <button class="burger__button" popovertarget="navbar">
                <img class="burger__icon" src="/icons/close__icon.svg" alt="menu close">
            </button>
            <ul class="navbar__list">
                <li>Startseite</li>
                <li>Über mich</li>
                <li>Portfolio</li>
                <li>Kontakt</li>
            </ul>
        </nav>

        <button id="navbar__toggle" class="burger__button" popovertarget="navbar">
            <img  class="burger__button" src="/icons/burger__icon.svg" alt="menu open" >
        </button>
    </header>
    <main>
        
    </main>
    <footer></footer>
</body>

</html>
